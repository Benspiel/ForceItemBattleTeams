name: Java CI with Maven

on:
  push:
    branches: [ "master", "claude/plugin-1-21-11-maven-54Edf" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: ForceItemBattleTeams-1.21.11
        path: target/Force-Item-Battle-Teams-1.0-SNAPSHOT.jar

    - name: Create GitHub Release
      if: github.ref == 'refs/heads/claude/plugin-1-21-11-maven-54Edf'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete v1.0-1.21.11 --yes 2>/dev/null || true
        gh release create v1.0-1.21.11 \
          --title "ForceItemBattleTeams v1.0 fuer MC 1.21.11" \
          --notes "Minecraft 1.21.11 Build" \
          --prerelease \
          target/Force-Item-Battle-Teams-1.0-SNAPSHOT.jar
